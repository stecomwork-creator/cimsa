<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Listesi - Ödeme Şekli</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--line:#dbe3ef;--text:#1f2937;--muted:#64748b;--primary:#2563eb;--danger:#b91c1c}
    *{box-sizing:border-box}
    body{margin:24px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    h1{margin:0 0 16px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
    .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
    label{display:block;font-size:13px;font-weight:700;color:#334155}
    input,select,button{width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
    button{border:0;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#475569}
    .summary{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:14px 0;color:var(--muted)}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{padding:11px 12px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}
    th{background:#eaf0f8;color:#334155}
    th.sortable{cursor:pointer;user-select:none}
    th.sortable:hover{background:#dbeafe}
    tbody tr:hover{background:#f8fafc}
    .badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e0f2fe;color:#075985}
    .badge.empty{background:#f1f5f9;color:#475569}
    .empty-message{display:none;margin-top:12px;padding:16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--danger);font-weight:700}
    @media(max-width:700px){body{margin:12px}table{display:block;overflow-x:auto}.summary{display:block}.summary span{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <h1>Sipariş Listesi</h1>

  <section class="panel" aria-label="Sipariş filtreleri">
    <div class="filters">
      <label>Sipariş veya müşteri ara
        <input id="search" type="search" placeholder="Örn: SIP-1001 veya müşteri adı">
      </label>
      <label>Ödeme Şekli
        <select id="paymentFilter">
          <option value="">Tümü</option>
        </select>
      </label>
      <button id="clear" class="secondary" type="button">Filtreleri Temizle</button>
    </div>
  </section>

  <div class="summary">
    <strong id="resultInfo">Hazırlanıyor...</strong>
    <span>“Ödeme Şekli” başlığına tıklayarak sıralama yapılabilir.</span>
  </div>

  <table aria-label="Sipariş listesi">
    <thead>
      <tr>
        <th>Sipariş No</th>
        <th>Müşteri</th>
        <th>Tarih</th>
        <th>Tutar</th>
        <th class="sortable" id="paymentSort" tabindex="0" role="button" aria-label="Ödeme şekline göre sırala">Ödeme Şekli ↕</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="empty" class="empty-message">Kayıt bulunamadı</div>

  <script>
    const orders = [
      { orderNo: "SIP-1001", customer: "Akdeniz Yapı", date: "2026-10-01", amount: 14500, paymentMethod: "Nakit", status: "Onaylandı" },
      { orderNo: "SIP-1002", customer: "Marmara Çimento", date: "2026-10-03", amount: 32800, paymentMethod: "Çek", status: "Bekliyor" },
      { orderNo: "SIP-1003", customer: "Ege Beton", date: "2026-10-05", amount: 9700, paymentMethod: "Havale", status: "Sevk Edildi" },
      { orderNo: "SIP-1004", customer: "İç Anadolu İnşaat", date: "2026-10-08", amount: 22100, paymentMethod: "", status: "Taslak" },
      { orderNo: "SIP-1005", customer: "Karadeniz Lojistik", date: "2026-10-11", amount: 18350, paymentMethod: null, status: "Onaylandı" },
      { orderNo: "SIP-1006", customer: "Güney Madencilik", date: "2026-10-13", amount: 41200, paymentMethod: "Nakit", status: "Bekliyor" },
      { orderNo: "SIP-1007", customer: "Trakya Prefabrik", date: "2026-10-15", amount: 26400, paymentMethod: "Havale", status: "Sevk Edildi" }
    ];

    const el = {
      search: document.getElementById("search"),
      paymentFilter: document.getElementById("paymentFilter"),
      clear: document.getElementById("clear"),
      rows: document.getElementById("rows"),
      empty: document.getElementById("empty"),
      resultInfo: document.getElementById("resultInfo"),
      paymentSort: document.getElementById("paymentSort")
    };

    let sortDirection = "asc";

    function normalizePayment(value){
      const text = value == null ? "" : String(value).trim();
      return text || "Belirtilmemiş";
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));
    }

    function formatCurrency(value){
      return new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" }).format(value);
    }

    function fillPaymentFilter(){
      const preferred = ["Nakit", "Çek", "Havale", "Belirtilmemiş"];
      const values = [...new Set(orders.map(order => normalizePayment(order.paymentMethod)))];
      preferred.filter(value => values.includes(value)).forEach(value => {
        el.paymentFilter.add(new Option(value, value));
      });
      values
        .filter(value => !preferred.includes(value))
        .sort((a,b) => a.localeCompare(b, "tr"))
        .forEach(value => el.paymentFilter.add(new Option(value, value)));
    }

    function getFilteredAndSortedOrders(){
      const search = el.search.value.trim().toLocaleLowerCase("tr-TR");
      const payment = el.paymentFilter.value;

      return orders
        .filter(order => {
          const paymentText = normalizePayment(order.paymentMethod);
          const haystack = (order.orderNo + " " + order.customer).toLocaleLowerCase("tr-TR");
          return (!search || haystack.includes(search)) && (!payment || paymentText === payment);
        })
        .sort((a,b) => {
          const result = normalizePayment(a.paymentMethod).localeCompare(normalizePayment(b.paymentMethod), "tr");
          return sortDirection === "asc" ? result : -result;
        });
    }

    function render(){
      const list = getFilteredAndSortedOrders();
      el.rows.innerHTML = list.map(order => {
        const payment = normalizePayment(order.paymentMethod);
        const badgeClass = payment === "Belirtilmemiş" ? "badge empty" : "badge";
        return "<tr>" +
          "<td>" + escapeHtml(order.orderNo) + "</td>" +
          "<td>" + escapeHtml(order.customer) + "</td>" +
          "<td>" + escapeHtml(order.date) + "</td>" +
          "<td>" + escapeHtml(formatCurrency(order.amount)) + "</td>" +
          "<td><span class=\"" + badgeClass + "\">" + escapeHtml(payment) + "</span></td>" +
          "<td>" + escapeHtml(order.status) + "</td>" +
        "</tr>";
      }).join("");

      el.empty.style.display = list.length ? "none" : "block";
      el.resultInfo.textContent = list.length + " sipariş gösteriliyor.";
      el.paymentSort.textContent = "Ödeme Şekli " + (sortDirection === "asc" ? "↑" : "↓");
      el.paymentSort.setAttribute("aria-sort", sortDirection === "asc" ? "ascending" : "descending");
    }

    function togglePaymentSort(){
      sortDirection = sortDirection === "asc" ? "desc" : "asc";
      render();
    }

    fillPaymentFilter();
    render();

    el.search.addEventListener("input", render);
    el.paymentFilter.addEventListener("change", render);
    el.clear.addEventListener("click", () => {
      el.search.value = "";
      el.paymentFilter.value = "";
      sortDirection = "asc";
      render();
    });
    el.paymentSort.addEventListener("click", togglePaymentSort);
    el.paymentSort.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        togglePaymentSort();
      }
    });
  </script>
</body>
</html>
