<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Müşteri Listesi</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--line:#dbe3ef;--text:#1f2937;--muted:#64748b;--primary:#2563eb}
    *{box-sizing:border-box}
    body{margin:24px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    h1{margin:0 0 16px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
    label{display:block;font-size:13px;font-weight:700;color:#334155}
    input{width:100%;max-width:420px;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
    .summary{margin:14px 0;color:var(--muted)}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{padding:11px 12px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}
    th{background:#eaf0f8;color:#334155}
    tbody tr:hover{background:#f8fafc}
    .email{color:var(--primary);font-weight:600}
    .empty{display:none;margin-top:12px;padding:16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;color:#b91c1c;font-weight:700}
    @media(max-width:700px){body{margin:12px}table{display:block;overflow-x:auto}}
  </style>
</head>
<body>
  <h1>Müşteri Listesi</h1>

  <section class="panel">
    <label>Müşteri ara
      <input id="search" type="search" placeholder="Ad, telefon, e-posta veya şehir ara">
    </label>
  </section>

  <div class="summary">
    <strong id="resultInfo">Hazırlanıyor...</strong>
  </div>

  <table aria-label="Müşteri listesi">
    <thead>
      <tr>
        <th>Müşteri No</th>
        <th>Müşteri Adı / Unvanı</th>
        <th>Telefon</th>
        <th>E-posta</th>
        <th>Şehir</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="empty" class="empty">Kayıt bulunamadı</div>

  <script>
    const customers = [
      { no: "M-1001", name: "Akdeniz İnşaat A.Ş.", phone: "0212 555 10 01", email: "satinalma@akdenizinsaat.com", city: "İstanbul", status: "Aktif" },
      { no: "M-1002", name: "Çimtaş Yapı Market", phone: "0312 555 20 02", email: "info@cimtasyapi.com", city: "Ankara", status: "Aktif" },
      { no: "M-1003", name: "Ege Beton Ltd. Şti.", phone: "0232 555 30 03", email: "", city: "İzmir", status: "Pasif" },
      { no: "M-1004", name: "Güney Lojistik", phone: "0322 555 40 04", email: "operasyon@guneylojistik.com", city: "Adana", status: "Aktif" },
      { no: "M-1005", name: "Karadeniz Ticaret", phone: "0462 555 50 05", email: null, city: "Trabzon", status: "Aktif" }
    ];

    const searchInput = document.getElementById("search");
    const rows = document.getElementById("rows");
    const empty = document.getElementById("empty");
    const resultInfo = document.getElementById("resultInfo");

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>'"]/g, ch => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        "\"":"&quot;"
      }[ch]));
    }

    function displayEmail(email){
      const value = String(email ?? "").trim();
      return value || "-";
    }

    function render(){
      const term = searchInput.value.trim().toLocaleLowerCase("tr-TR");
      const filtered = customers.filter(customer => {
        const searchable = [
          customer.no,
          customer.name,
          customer.phone,
          customer.email,
          customer.city,
          customer.status
        ].join(" ").toLocaleLowerCase("tr-TR");
        return !term || searchable.includes(term);
      });

      rows.innerHTML = filtered.map(customer => {
        const email = displayEmail(customer.email);
        return "<tr>" +
          "<td>" + escapeHtml(customer.no) + "</td>" +
          "<td>" + escapeHtml(customer.name) + "</td>" +
          "<td>" + escapeHtml(customer.phone) + "</td>" +
          "<td class=\"email\">" + escapeHtml(email) + "</td>" +
          "<td>" + escapeHtml(customer.city) + "</td>" +
          "<td>" + escapeHtml(customer.status) + "</td>" +
        "</tr>";
      }).join("");

      empty.style.display = filtered.length ? "none" : "block";
      resultInfo.textContent = filtered.length + " müşteri listeleniyor.";
    }

    searchInput.addEventListener("input", render);
    render();
  </script>
</body>
</html>
