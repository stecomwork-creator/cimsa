<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Raporlar</title>
<style>
body{font-family:Arial,sans-serif;margin:24px;background:#f6f8fb;color:#1f2937}
h1{margin-top:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;background:white;padding:16px;border-radius:10px;box-shadow:0 1px 5px #d8dee9}
label{font-weight:700;font-size:14px}
input,select,button{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
button{background:#334155;color:white;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:18px;background:white}
th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}
th{background:#e2e8f0}
#empty{padding:18px;background:white;border-radius:8px;text-align:center;color:#b91c1c}
#count{font-weight:700}
</style>
</head>
<body>
<h1>Raporlar</h1>
<div class="filters">

fill(dep,data.map(r=>r[1]));fill(st,data.map(r=>r[3]));

 const t=q.value.trim().toLowerCase();
 const list=data.filter(r=>(!t||r[0].toLowerCase().includes(t))&&(!dep.value||r[1]===dep.value)&&(!st.value||r[3]===st.value)&&(!start.value||r[2]>=start.value)&&(!end.value||r[2]<=end.value));

</body>
</html>
