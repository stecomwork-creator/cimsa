<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raporlar - Performanslı Liste</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--line:#dbe3ef;--text:#1f2937;--muted:#64748b;--primary:#2563eb;--danger:#b91c1c}
    *{box-sizing:border-box}
    body{margin:24px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    h1{margin:0 0 16px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
    .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
    label{display:block;font-size:13px;font-weight:700;color:#334155}
    input,select,button{width:100%;margin-top:6px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff}
    button{border:0;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#475569}
    button:disabled{background:#cbd5e1;cursor:not-allowed}
    .summary{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:14px 0;color:var(--muted)}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    th,td{padding:11px 12px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}
    th{background:#eaf0f8;color:#334155}
    tbody tr:hover{background:#f8fafc}
    .empty{display:none;margin-top:12px;padding:16px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--danger);font-weight:700}
    .pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
    .pager button{width:auto;min-width:100px}
    @media(max-width:700px){body{margin:12px}.summary,.pager{justify-content:stretch}.pager button{flex:1}table{display:block;overflow-x:auto}}
  </style>
</head>
<body>
  <h1>Raporlar</h1>

  <section class="panel">
    <div class="filters">
      <label>Rapor Adı
        <input id="search" type="search" placeholder="Rapor adı ara">
      </label>
      <label>Departman
        <select id="department"><option value="">Tümü</option></select>
      </label>
      <label>Durum
        <select id="status"><option value="">Tümü</option></select>
      </label>
      <label>Başlangıç Tarihi
        <input id="startDate" type="date">
      </label>
      <label>Bitiş Tarihi
        <input id="endDate" type="date">
      </label>
      <button id="clear" class="secondary" type="button">Temizle</button>
    </div>
  </section>

  <div class="summary">
    <strong id="resultInfo">Hazırlanıyor...</strong>
    <span>Sayfa başına 50 kayıt gösterilir. İlk açılışta varsayılan tarih aralığı son 30 gündür.</span>
  </div>

  <table aria-label="Rapor listesi">
    <thead>
      <tr>
        <th>Rapor Adı</th>
        <th>Departman</th>
        <th>Tarih</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="empty" class="empty">Kayıt bulunamadı</div>

  <div class="pager">
    <button id="prev" type="button">Önceki</button>
    <span id="pageInfo">Sayfa 1 / 1</span>
    <button id="next" type="button">Sonraki</button>
  </div>

  <script>
    const PAGE_SIZE = 50;
    const DAY_MS = 24 * 60 * 60 * 1000;
    const reportNames = ["Aylık Satış Raporu", "Bütçe Takip Raporu", "Üretim Kalite Analizi", "İnsan Kaynakları Özeti", "Bakım Planlama Raporu", "Saha Operasyon Raporu", "Stok Devir Raporu", "Nakit Akış Raporu"];
    const departments = ["Satış", "Finans", "Üretim", "İK", "Bakım", "Lojistik"];
    const statuses = ["Taslak", "Onaylandı", "Reddedildi"];

    const el = {
      search: document.getElementById("search"),
      department: document.getElementById("department"),
      status: document.getElementById("status"),
      startDate: document.getElementById("startDate"),
      endDate: document.getElementById("endDate"),
      clear: document.getElementById("clear"),
      rows: document.getElementById("rows"),
      empty: document.getElementById("empty"),
      resultInfo: document.getElementById("resultInfo"),
      pageInfo: document.getElementById("pageInfo"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next")
    };

    let currentPage = 1;
    let filtered = [];

    function pad(n){ return String(n).padStart(2, "0"); }
    function toIsoDate(date){ return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()); }
    function escapeHtml(value){
      return String(value).replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[ch]));
    }

    function createData(count){
      const today = new Date();
      const data = [];
      for(let i = 0; i < count; i++){
        const date = new Date(today.getTime() - (i % 730) * DAY_MS);
        data.push({
          name: reportNames[i % reportNames.length] + " #" + (i + 1),
          department: departments[i % departments.length],
          date: toIsoDate(date),
          status: statuses[i % statuses.length]
        });
      }
      return data;
    }

    const reports = createData(20000);

    function fillSelect(select, values){
      [...new Set(values)].sort((a,b) => a.localeCompare(b, "tr")).forEach(value => {
        select.add(new Option(value, value));
      });
    }

    function setDefaultDates(){
      const today = new Date();
      const start = new Date(today.getTime() - 30 * DAY_MS);
      el.startDate.value = toIsoDate(start);
      el.endDate.value = toIsoDate(today);
    }

    function applyFilters(resetPage = true){
      if(resetPage) currentPage = 1;

      const text = el.search.value.trim().toLocaleLowerCase("tr-TR");
      const department = el.department.value;
      const status = el.status.value;
      const start = el.startDate.value;
      const end = el.endDate.value;

      filtered = reports.filter(report =>
        (!text || report.name.toLocaleLowerCase("tr-TR").includes(text)) &&
        (!department || report.department === department) &&
        (!status || report.status === status) &&
        (!start || report.date >= start) &&
        (!end || report.date <= end)
      );

      renderPage();
    }

    function renderPage(){
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if(currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageRows = filtered.slice(startIndex, startIndex + PAGE_SIZE);

      el.rows.innerHTML = pageRows.map(report =>
        "<tr>" +
        "<td>" + escapeHtml(report.name) + "</td>" +
        "<td>" + escapeHtml(report.department) + "</td>" +
        "<td>" + escapeHtml(report.date) + "</td>" +
        "<td>" + escapeHtml(report.status) + "</td>" +
        "</tr>"
      ).join("");

      el.empty.style.display = filtered.length ? "none" : "block";
      el.resultInfo.textContent = filtered.length + " kayıt bulundu; " + pageRows.length + " kayıt gösteriliyor.";
      el.pageInfo.textContent = "Sayfa " + currentPage + " / " + totalPages;
      el.prev.disabled = currentPage <= 1;
      el.next.disabled = currentPage >= totalPages;
    }

    fillSelect(el.department, reports.map(r => r.department));
    fillSelect(el.status, reports.map(r => r.status));
    setDefaultDates();
    applyFilters(true);

    [el.search, el.department, el.status, el.startDate, el.endDate].forEach(input => {
      input.addEventListener("input", () => applyFilters(true));
    });

    el.clear.addEventListener("click", () => {
      el.search.value = "";
      el.department.value = "";
      el.status.value = "";
      setDefaultDates();
      applyFilters(true);
    });

    el.prev.addEventListener("click", () => {
      if(currentPage > 1){ currentPage--; renderPage(); }
    });

    el.next.addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if(currentPage < totalPages){ currentPage++; renderPage(); }
    });
  </script>
</body>
</html>
